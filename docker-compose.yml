services:
  ws-backend:
    build:
      context: .
      dockerfile: ./apps/ws-backend/Dockerfile
    container_name: draw_app_ws
    environment:
      PORT: 8088
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8088:8088"
    networks:
      - draw_network

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: draw_app_frontend
    environment:
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8088}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "8000:8000"
    depends_on:
      ws-backend:
        condition: service_started
    networks:
      - draw_network

networks:
  draw_network:

volumes:
  postgres_data:
